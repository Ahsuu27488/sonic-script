[package]
name = "sonicscript"
version = "0.1.0"
description = "SonicScript for Windows: dictation into any app (M1)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
sonicscript-core = { path = "../core" }
hound = "3"
serde_json = "1"
cpal = "0.18.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_Security", "Win32_System_SystemInformation"] }
winreg = "0.55"
