<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>SonicScript mic</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="popup.css">
<script src="popup.js" defer></script>
</head>
<body>
<div class="bar">
  <button class="off" id="off" type="button" title="Not in this app" aria-label="Turn the mic off in this app">
    <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M3 3l6 6M9 3l-6 6"/></svg>
  </button>
  <button class="mic" id="mic" type="button" aria-label="Dictate" aria-pressed="false">
    <span class="ring" aria-hidden="true"><span class="core"></span></span>
  </button>
</div>
</body>
</html>
