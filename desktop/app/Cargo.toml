[package]
name = "sonicscript-app"
version = "0.1.0"
description = "SonicScript for Windows: the tray app (M2)"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "sonicscript-tray"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
sonicscript = { path = "../win" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
