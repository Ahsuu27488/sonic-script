[package]
name = "sonicscript-core"
version = "0.1.0"
description = "Platform-free core of the SonicScript desktop app: text cleanup, voice gate, encoding, Groq"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.22"
ogg = "0.9.2"
opus = "0.4.0"
reqwest = { version = "0.13.5", features = ["blocking", "multipart", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
hound = "3"
