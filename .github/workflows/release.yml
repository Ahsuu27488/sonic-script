# Release (M2 phase 7, D-052; auto-update D-053): on a v* tag, build the Windows installer, sign it for the
# updater and attach it with `latest.json` to a DRAFT GitHub Release. The owner pushes the tag and publishes the
# release; nothing here publishes. Installed apps read
# releases/latest/download/latest.json, which only a PUBLISHED release serves, so a draft never reaches them.
# `workflow_dispatch` builds the installer as a run artifact only (a dry build, no release).
#
# Secrets (the owner sets them): TAURI_SIGNING_PRIVATE_KEY (the updater key file's text) and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD. The public half is plugins.updater.pubkey in tauri.conf.json.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write # create the draft release
    defaults:
      run:
        working-directory: desktop/app
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:TAG -ne "v$version") { throw "tag $env:TAG != v$version in tauri.conf.json" }
      # The version the installer hooks (installer.nsh) were checked against: change it only after re-checking
      # them against the new template.
      - name: Tauri CLI
        run: cargo install tauri-cli --version 2.12.4 --locked
      - name: Build and sign the installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --bundles nsis
      - name: Find the installer and write latest.json
        id: find
        shell: pwsh
        env:
          REPO: ${{ github.repository }}
        run: |
          $exe = Get-ChildItem ../target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $exe) { throw "no installer was built" }
          $sig = "$($exe.FullName).sig"
          if (-not (Test-Path $sig)) { throw "no updater signature: are the signing secrets set?" }
          $version = (Get-Content tauri.conf.json -Raw | ConvertFrom-Json).version
          # GitHub turns spaces in asset names into dots; the installer's name has none.
          $url = "https://github.com/$env:REPO/releases/download/v$version/$($exe.Name)"
          $latest = [ordered]@{
            version   = $version
            notes     = "SonicScript $version"
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{ signature = (Get-Content $sig -Raw).Trim(); url = $url }
            }
          }
          $json = Join-Path $exe.DirectoryName "latest.json"
          $latest | ConvertTo-Json -Depth 5 | Set-Content -Path $json -Encoding utf8NoBOM
          "path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          "latest=$json" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            ${{ steps.find.outputs.path }}
            ${{ steps.find.outputs.latest }}
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          SETUP: ${{ steps.find.outputs.path }}
          LATEST: ${{ steps.find.outputs.latest }}
        run: |
          gh release create $env:TAG $env:SETUP $env:LATEST --draft --title "SonicScript $env:TAG" `
            --notes "Windows installer (unsigned: SmartScreen shows 'More info' then 'Run anyway'). Needs a free Gemini key."
