[project]
name = "sonic-eval"
version = "0.1.0"
description = "SonicScript M0: record test sentences and benchmark cloud speech engines for Roman Urdu / Hinglish dictation."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "httpx>=0.27",
  "numpy>=1.26",
  "sounddevice>=0.4.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sonic_eval"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Inline CSS/HTML templates read better unwrapped.
"sonic_eval/report.py" = ["E501"]
